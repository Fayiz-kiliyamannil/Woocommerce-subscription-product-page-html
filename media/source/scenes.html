<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Open+Sans:wght@400;600&display=block" rel="stylesheet">
<style>
:root { --blue:#0a6cff; --navy:#1b2140; --gray:#8a93a6; --line:#dfe6f0; --soft:#eaf1fb; --green:#12b76a; --red:#f04438; --amber:#f5a524; }
* { box-sizing:border-box; margin:0; }
html,body { width:1280px; height:1120px; overflow:hidden; background:#fff; }
body { font-family:Quicksand, sans-serif; color:var(--navy); }
#stage { position:relative; width:1280px; height:1120px; overflow:hidden; background:#fff; }
.blob { position:absolute; border-radius:50%; background:var(--soft); }
.dots { position:absolute; width:270px; height:240px; background-image:radial-gradient(#b9cdf0 2.4px, transparent 2.6px); background-size:28px 28px; }
.win { position:absolute; background:#fff; border-radius:28px; box-shadow:0 30px 70px -20px rgba(27,60,120,.25), 0 2px 8px rgba(27,60,120,.06); overflow:hidden; }
.win-h { height:66px; background:#f4f7fb; border-bottom:1.5px solid #e6ecf4; display:flex; align-items:center; padding:0 28px; gap:10px; }
.tl { width:17px; height:17px; border-radius:50%; } .tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.win-t { margin-left:22px; font-weight:700; font-size:21px; }
.url { margin-left:22px; flex:1; height:36px; border:1.5px solid #e1e7f0; border-radius:18px; background:#fff; color:var(--gray); font:17px "Open Sans"; display:flex; align-items:center; padding:0 18px; }
.win-b { padding:30px 40px 36px; }
.card { position:absolute; background:#fff; border-radius:24px; padding:30px 32px; box-shadow:0 30px 70px -22px rgba(27,60,120,.28), 0 2px 8px rgba(27,60,120,.06); }
.badge { position:absolute; width:104px; height:104px; border-radius:50%; background:var(--blue); display:grid; place-items:center; box-shadow:0 16px 36px -8px rgba(10,108,255,.55); }
.badge svg { width:48px; height:48px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.ic { width:26px; height:26px; stroke:var(--blue); fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.lbl { font-weight:600; font-size:22px; margin:0 0 12px; }
.fld { height:70px; border:2px solid #e1e7f0; border-radius:16px; display:flex; align-items:center; padding:0 24px; font:23px "Open Sans"; color:var(--navy); margin-bottom:26px; position:relative; background:#fff; }
.fld.ph { color:#a9b1c1; }
.fld .suf { position:absolute; right:0; top:0; bottom:0; width:80px; border-left:2px solid #e1e7f0; background:#f6f8fb; display:grid; place-items:center; font:700 22px Quicksand; border-radius:0 14px 14px 0; }
.fld .chev { position:absolute; right:24px; top:24px; width:14px; height:14px; border-right:3px solid #8a93a6; border-bottom:3px solid #8a93a6; transform:rotate(45deg); }
.fld.focus { border-color:var(--blue); box-shadow:0 0 0 4px rgba(10,108,255,.12); }
.fld.focus[data-on]:not(.on) { border-color:#e1e7f0; box-shadow:none; }
.caret { display:inline-block; width:2px; height:28px; background:var(--blue); margin-left:2px; vertical-align:middle; }
.seg { display:flex; background:#f1f4f9; border:2px solid #e6ebf3; border-radius:18px; padding:7px; margin-bottom:26px; }
.seg > div { flex:1; text-align:center; padding:15px 6px; border-radius:13px; font-weight:700; font-size:21px; color:#8a93a6; }
.seg > div.on { background:#fff; color:var(--blue); box-shadow:0 6px 16px -6px rgba(27,60,120,.25); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; height:70px; padding:0 34px; border-radius:16px; background:var(--blue); color:#fff; font-weight:700; font-size:24px; }
.btn.ghost { background:#fff; color:var(--blue); border:2px solid var(--blue); }
.btn.green { background:var(--green); }
.btn.wide { width:100%; }
.btn.press { transform:scale(.95); filter:brightness(.92); }
.row { display:flex; align-items:center; gap:16px; }
.between { display:flex; align-items:center; justify-content:space-between; gap:16px; }
.muted { color:var(--gray); }
.eyebrow { font-weight:700; font-size:19px; letter-spacing:.12em; color:var(--blue); text-transform:uppercase; margin-bottom:18px; }
.big { font-weight:700; font-size:44px; color:var(--blue); }
.h { font-weight:700; font-size:30px; }
.t20 { font-size:20px; } .t22 { font-size:22px; } .t24 { font-size:24px; } .t26{font-size:26px;}
.b { font-weight:700; }
.list > div { padding:18px 0; border-bottom:2px solid #eef2f7; font-size:22px; }
.list > div:last-child { border-bottom:0; }
.pill { display:inline-flex; align-items:center; gap:8px; padding:7px 16px; border-radius:999px; font-weight:700; font-size:18px; }
.p-green { background:#e6f8ef; color:var(--green); } .p-red { background:#fdecea; color:var(--red); } .p-blue { background:#e8f1ff; color:var(--blue); } .p-gray { background:#f1f3f7; color:#7d869a; } .p-amber{background:#fff4e0;color:#c27c00;}
.tog { width:66px; height:38px; border-radius:19px; background:#d7dde8; position:relative; flex:none; }
.tog::after { content:""; position:absolute; top:4px; left:4px; width:30px; height:30px; border-radius:50%; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.2); }
.tog.on { background:var(--blue); } .tog.on::after { left:32px; }
.radio { width:28px; height:28px; border-radius:50%; border:2.5px solid #c3cbd8; flex:none; position:relative; }
.radio.on { border-color:var(--blue); } .radio.on::after { content:""; position:absolute; inset:5px; border-radius:50%; background:var(--blue); }
.chk { width:28px; height:28px; border-radius:8px; border:2.5px solid #c3cbd8; flex:none; display:grid; place-items:center; }
.chk.on { background:var(--blue); border-color:var(--blue); } .chk.on::after { content:"✓"; color:#fff; font-weight:800; font-size:18px; }
.opt { display:flex; align-items:center; gap:16px; padding:18px 20px; border:2px solid #e6ebf3; border-radius:16px; margin-bottom:14px; font-size:22px; font-weight:600; }
.opt.on { border-color:var(--blue); background:#f3f8ff; }
.thumb { width:88px; height:88px; border-radius:18px; background:var(--soft); display:grid; place-items:center; flex:none; }
.thumb svg { width:46px; height:46px; }
.bar { height:16px; border-radius:8px; background:#e8edf5; overflow:hidden; } .bar > i { display:block; height:100%; background:var(--blue); border-radius:8px; }
.okc { width:34px; height:34px; border-radius:50%; background:var(--green); color:#fff; display:grid; place-items:center; font-weight:800; font-size:20px; flex:none; }
#cursor { position:absolute; left:0; top:0; width:44px; height:44px; z-index:50; pointer-events:none; filter:drop-shadow(0 3px 4px rgba(0,0,0,.25)); transform-origin:6px 4px; }
#ripple { position:absolute; width:70px; height:70px; margin:-35px 0 0 -35px; border-radius:50%; border:3px solid var(--blue); z-index:49; opacity:0; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
.stat { border:2px solid #e9eef5; border-radius:18px; padding:18px 20px; }
.stat .n { font-weight:700; font-size:38px; }
.stat .k { font-size:17px; color:var(--gray); font-weight:600; }
table.mini { width:100%; border-collapse:collapse; font:18px "Open Sans"; }
table.mini td { padding:11px 8px; border-bottom:1.5px solid #eef2f7; } table.mini tr:first-child td { font:700 16px Quicksand; color:var(--gray); text-transform:uppercase; letter-spacing:.06em; }
</style></head>
<body><div id="stage"></div>
<svg id="cursorSvg" style="display:none"></svg>
<script>
/* ---------------- icons (stroke paths, 24x24) ---------------- */
const I = {
	card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
	layers:'<path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
	truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/>',
	trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
	percent:'<path d="M19 5 5 19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
	tag:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
	msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',
	chart:'<path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/>',
	download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
	sync:'<path d="M21 12a9 9 0 0 1-15.5 6.3L3 16M3 12a9 9 0 0 1 15.5-6.3L21 8"/><path d="M21 3v5h-5M3 21v-5h5"/>',
	switch:'<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',
	upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/>',
	retry:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
	bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/>',
	lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
	mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
	ff:'<path d="m13 19 9-7-9-7zM2 19l9-7-9-7z"/>',
	rotate:'<path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>',
	toggle:'<rect x="1" y="6" width="22" height="12" rx="6"/><circle cx="16" cy="12" r="3"/>',
	pause:'<rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/>',
	gift:'<path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>',
	help:'<circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/>',
	box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
	coffee:'<path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><path d="M6 2v3M10 2v3M14 2v3"/>',
	user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
	cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
	file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/>',
	play:'<polygon points="6 4 20 12 6 20 6 4"/>',
	cart:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
};
const svg = (k, cls = 'ic') => `<svg class="${cls}" viewBox="0 0 24 24">${I[k]}</svg>`;

/* ---------------- building blocks ---------------- */
const win = (x, y, w, head, body, anim = '0.2 0.7 up') => `<div class="win" style="left:${x}px;top:${y}px;width:${w}px" data-in="${anim}"><div class="win-h"><span class="tl r"></span><span class="tl y"></span><span class="tl g"></span>${head.startsWith('url:') ? `<div class="url">${head.slice(4)}</div>` : `<div class="win-t">${head}</div>`}</div><div class="win-b">${body}</div></div>`;
const card = (x, y, w, body, anim = '0.7 0.6 left', extra = '') => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;${extra}" data-in="${anim}">${body}</div>`;
const badge = (x, y, icon, at = 1.0) => `<div class="badge" style="left:${x}px;top:${y}px" data-in="${at} 0.5 pop">${svg(icon, '')}</div>`;
const decor = (v) => v === 'a'
	? `<div class="blob" style="width:520px;height:520px;left:840px;top:-110px"></div><div class="dots" style="left:72px;top:860px"></div>`
	: `<div class="blob" style="width:600px;height:600px;left:860px;top:720px"></div><div class="dots" style="left:44px;top:840px"></div>`;
const typed = (text, start, dur, cls = '') => `<span data-type="${start} ${dur}" data-text="${text}" class="${cls}"></span>`;
const field = (label, inner, opts = '') => `${label ? `<div class="lbl">${label}</div>` : ''}<div class="fld ${opts}">${inner}</div>`;
const swap = (t, a, b) => `<span data-swap="${t}"><span class="a">${a}</span><span class="b">${b}</span></span>`;

/* ---------------- scenes ---------------- */
// Each scene: html, cursor: [[time, target]], clicks: [times], dur (s).
const S = {};

S['stripe-paypal-auto-renewals'] = {
	html: decor('a') +
		win(72, 150, 610, 'url:yourstore.com/checkout', `
			<div class="row" style="margin-bottom:26px"><div class="thumb">${svg('coffee')}</div><div><div class="h">Coffee Club Box</div><div class="t22 muted">$29.00 / month</div></div></div>
			<div class="lbl">Payment method</div>
			<div class="opt" data-on="1.3" data-oncls="on" id="o1"><span class="radio" data-on="1.3"></span>${svg('card')} Credit card (Stripe)</div>
			<div class="opt"><span class="radio"></span>${svg('mail')} PayPal</div>
			${field('', typed('4242  4242  4242  4242', 1.8, 1.2), 'focus" data-on="1.6')}
			<div class="btn wide" id="sub" data-press="3.4">Subscribe now</div>`) +
		card(732, 230, 476, `
			<div class="eyebrow">Renewals</div>
			<div class="list">
				<div class="between" data-in="3.7 0.4 up"><span class="b">Nov 1</span><span>$29.00</span><span class="pill p-green">Paid</span></div>
				<div class="between" data-in="4.0 0.4 up"><span class="b">Dec 1</span><span>$29.00</span><span class="pill p-blue">Auto-charge</span></div>
				<div class="between" data-in="4.3 0.4 up"><span class="b">Jan 1</span><span>$29.00</span><span class="pill p-blue">Auto-charge</span></div>
			</div>`, '0.8 0.6 left') +
		badge(1132, 120, 'card'),
	cursor: [[0, [700, 1000]], [1.0, '#o1'], [1.5, '#o1'], [2.9, '#sub'], [4.6, [1000, 930]]], clicks: [1.3, 3.4], dur: 5.6,
};

S['variable-subscription-products'] = {
	html: decor('b') +
		win(72, 150, 610, 'Variations', `
			<div class="list">
				${[['250 g', '$15.00'], ['500 g', '$27.00'], ['1 kg', '$49.00']].map((v, i) => `<div class="between" data-in="${0.9 + i * 0.3} 0.4 up"><div class="row"><span class="pill p-blue">#${i + 1}</span><span class="b t24">${v[0]}</span></div><span class="t22">${v[1]} <span class="muted">/ month</span></span></div>`).join('')}
			</div>
			<div class="lbl" style="margin-top:22px">Bill every</div>
			<div class="seg"><div class="on">1 month</div><div>3 months</div><div>Year</div></div>
			<div class="row t20 muted">${svg('layers')} Own price, trial &amp; sign-up fee per variation</div>`) +
		card(732, 250, 476, `
			<div class="thumb" style="width:100%;height:190px;margin-bottom:24px"><svg class="ic" style="width:90px;height:90px" viewBox="0 0 24 24">${I.coffee}</svg></div>
			<div class="h" style="margin-bottom:6px">Coffee Subscription</div>
			<div class="big">${swap(2.9, '$15.00', '$27.00')}<span class="t22 muted"> / month</span></div>
			<div class="seg" style="margin:20px 0 0"><div data-off="2.9" class="on">250 g</div><div data-on="2.9" id="v2">500 g</div><div>1 kg</div></div>`, '0.6 0.6 left') +
		badge(1132, 140, 'layers'),
	cursor: [[0, [700, 1000]], [1.8, [1000, 1000]], [2.6, '#v2'], [4.4, [1100, 1000]]], clicks: [2.9], dur: 5.4,
};

S['separate-shipping-schedule'] = {
	html: decor('a') +
		win(72, 150, 610, 'Subscription', `
			${field('Subscription price', '90.00<span class="suf">$</span>')}
			<div class="lbl">Bill every</div>
			<div class="seg"><div>1 month</div><div class="on">3 months</div><div>Year</div></div>
			<div class="lbl">Ship every</div>
			<div class="fld focus" data-on="1.4" id="ship">${typed('1', 1.7, 0.3)}<span class="suf" style="width:150px;font-size:20px">Month</span></div>`) +
		card(732, 280, 476, `
			<div class="eyebrow">Schedule</div>
			<div class="b t22" style="margin-bottom:12px">Billed</div>
			<div class="row" style="gap:10px;margin-bottom:24px">${['Jan', 'Feb', 'Mar', 'Apr'].map((m, i) => `<span class="pill ${i % 3 === 0 ? 'p-blue' : 'p-gray'}" style="flex:1;justify-content:center" data-in="${2.4 + i * 0.15} 0.3 pop">${m}</span>`).join('')}</div>
			<div class="b t22" style="margin-bottom:12px">Shipped</div>
			<div class="row" style="gap:10px">${['Jan', 'Feb', 'Mar', 'Apr'].map((m, i) => `<span class="pill p-green" style="flex:1;justify-content:center" data-in="${3.1 + i * 0.25} 0.3 pop">${svg('box', 'ic" style="width:18px;height:18px;stroke:currentColor')}${m}</span>`).join('')}</div>`) +
		badge(1132, 150, 'truck'),
	cursor: [[0, [700, 1000]], [1.2, '#ship'], [2.4, '#ship'], [4.6, [1050, 980]]], clicks: [1.4], dur: 5.6,
};

S['price-change-for-existing-subscribers'] = {
	html: decor('b') +
		win(72, 150, 610, 'Existing Subscribers: Price', `
			<div class="between t22" style="margin-bottom:22px"><span class="muted">Current price</span><span class="b">$29.00 / month</span></div>
			${field('New price', typed('35.00', 1.2, 0.7) + '<span class="suf">$</span>', 'focus" data-on="1.0" id="np')}
			<div class="lbl">Apply from</div>
			<div class="seg"><div class="on">Next renewal</div><div>A date</div></div>
			<div class="row t22" style="margin-bottom:26px"><span class="chk" data-on="2.4" id="em"></span> Email subscribers about the change</div>
			<div class="btn wide" id="upd" data-press="3.3">Update 128 subscriptions</div>`) +
		card(732, 300, 476, `
			<div class="row" style="margin-bottom:18px">${svg('mail')}<span class="b t22">Your price is changing</span></div>
			<div class="row" style="gap:18px;margin-bottom:12px"><span class="t26 muted" style="text-decoration:line-through">$29.00</span><span class="t26">→</span><span class="big" style="font-size:40px">$35.00</span></div>
			<div class="t20 muted">From your next renewal on Jan 1</div>`, '3.6 0.6 left') +
		badge(1132, 150, 'trend', 3.9),
	cursor: [[0, [700, 1000]], [0.9, '#np'], [2.1, '#em'], [2.9, '#upd'], [4.6, [1050, 1000]]], clicks: [1.0, 2.4, 3.3], dur: 5.6,
};

S['subscription-coupon-codes'] = {
	html: decor('a') +
		win(72, 150, 610, 'Coupon data', `
			${field('Coupon code', typed('WELCOME50', 0.9, 0.9), 'focus" data-on="0.8" id="cc')}
			${field('Discount type', 'Recurring % discount<span class="chev"></span>')}
			<div class="grid2">
				<div>${field('Amount', typed('50', 2.0, 0.3) + '<span class="suf">%</span>')}</div>
				<div>${field('Active for payments', typed('3', 2.5, 0.2))}</div>
			</div>
			<div class="btn" id="pub" data-press="3.1" style="float:right">Publish</div><div style="clear:both"></div>`) +
		card(732, 270, 476, `
			<div class="eyebrow">Cart</div>
			<div class="between t22" style="margin-bottom:16px"><span>Coffee Club Box</span><span>$30.00 / mo</span></div>
			<div class="between t22" style="margin-bottom:16px" data-in="3.6 0.4 up"><span class="pill p-blue">${svg('tag', 'ic" style="width:18px;height:18px;stroke:currentColor')}WELCOME50</span><span style="color:var(--green)" class="b">−$15.00</span></div>
			<div class="t20 muted" style="margin-bottom:18px" data-in="3.9 0.4 up">50% off your first 3 payments</div>
			<div class="between" style="border-top:2px solid #eef2f7;padding-top:18px"><span class="t22 muted">Total</span><span class="big">${swap(3.7, '$30.00', '$15.00')}</span></div>`, '0.6 0.6 left') +
		badge(1132, 140, 'percent'),
	cursor: [[0, [700, 1000]], [0.7, '#cc'], [2.8, '#pub'], [4.6, [1050, 1000]]], clicks: [0.8, 3.1], dur: 5.6,

/* ---------------- engine ---------------- */
const key = new URLSearchParams(location.search).get('s');
const scene = S[key];
window.SCENES = Object.keys(S);
const stage = document.getElementById('stage');
if (scene) {
	stage.innerHTML = scene.html + '<div id="ripple"></div><svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 4 19 8.5 14.5 11.5 21 14.5 19.7 11.5 13.3 18 13.3Z" fill="#1b2140" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>';
	window.DUR = scene.dur;
	// Group the cards (not the background shapes) and fit them to the canvas, centred.
	const g = document.createElement("div"); g.id = "group"; g.style.cssText = "position:absolute;left:0;top:0;width:1280px;height:1120px;transform-origin:0 0";
